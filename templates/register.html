{% extends "base_auth.html" %}
{% block title %}Create account · TaskFlow{% endblock %}
{% block content %}
<h1>Create your workspace</h1>
{% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('auth.register') }}" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Name<input type="text" name="name" autocomplete="name" maxlength="60" required autofocus></label>
  <label>Email<input type="email" name="email" autocomplete="email" required></label>
  <label>Password <small>(8+ characters)</small><input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
  <button class="btn primary" type="submit">Create account</button>
</form>
<p class="auth-alt">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
{% endblock %}
