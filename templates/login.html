{% extends "base_auth.html" %}
{% block title %}Sign in · TaskFlow{% endblock %}
{% block content %}
<h1>Welcome back</h1>
{% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('auth.login') }}" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Email<input type="email" name="email" autocomplete="email" required autofocus></label>
  <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
  <button class="btn primary" type="submit">Sign in</button>
</form>
<p class="auth-alt">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
{% endblock %}
